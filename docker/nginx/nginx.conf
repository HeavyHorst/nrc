load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Resolve optional sidecars at request time, not during Nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    
    # Enable gzip compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # TLS termination is handled by Tailscale proxy (upstream)
        # This nginx instance handles local HTTP proxying only

        # Trust upstream headers from Tailscale proxy
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Enable Brotli only where the build emits .br siblings. The static
        # module can suppress gzip even when a requested .br file is absent.
        location = /index.html {
            brotli_static on;
            add_header Cache-Control "no-cache";
        }

        # Only build-generated, content-hashed CSS/fonts/scripts live here.
        # Missing old assets must be 404s, never the SPA HTML or cached errors.
        location ^~ /assets/ {
            brotli_static on;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # PWA metadata and update checks must not be served from a stale HTTP cache.
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            add_header Cache-Control "no-cache";
        }

        location = /service-worker.js {
            add_header Cache-Control "no-cache";
        }

        # Proxy WebSocket connections to websocket-server (workspace paths)
        location ~ ^/[^./]+$ {
            proxy_pass http://websocket-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pass Tailscale identity headers from upstream proxy
            # These headers are set by the Tailscale proxy and should not be trusted
            # from external sources. The Tailscale proxy is the only trusted source.
            # SECURITY: If requests could bypass Tailscale, these would need validation.
            # In docker-compose, nginx only receives traffic from tailscale-proxy.
            proxy_set_header X-Tailscale-Login $http_x_tailscale_login;
            proxy_set_header X-Tailscale-User $http_x_tailscale_user;
            proxy_set_header X-Tailscale-Node $http_x_tailscale_node;
            proxy_set_header X-NRC-Auth $http_x_nrc_auth;
            
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            
            # Low-latency WebSocket settings
            proxy_buffering off;
            tcp_nodelay on;
        }

# Proxy search API to search service (^~ stops regex matching)
location ^~ /search {
    set $search_upstream http://search:8090;
    rewrite ^/search(/.*)$ $1 break;
    proxy_pass $search_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Proxy AI API to ai service
location ^~ /ai/ {
    set $ai_upstream http://ai:8091;
    rewrite ^/ai(/.*)$ $1 break;
    proxy_pass $ai_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
}

        # Handle CSS files
        location ~* \.css$ {
            add_header Content-Type text/css;
            expires 1d;
        }

        # Handle JavaScript files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            expires 1d;
        }
    }
}
