<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" fill="#ffffff"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#231f20" stroke-width="2"/>
  
  <!-- NRC Text - terminal style -->
  <text x="32" y="44" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="700" 
        text-anchor="middle" fill="#F04E30" letter-spacing="2">NRC</text>
  
  <!-- Terminal cursor indicator -->
  <rect x="48" y="36" width="3" height="12" fill="#F04E30" opacity="0.8"/>
</svg>
